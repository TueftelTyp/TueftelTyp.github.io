<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image to Base64 Converter</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101216;
      --panel: #191d24;
      --panel-2: #222832;
      --text: #f1f3f5;
      --muted: #aeb6c2;
      --accent: #5aa9ff;
      --border: #384150;
      --danger: #ff7272;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.45;
    }

    .container {
      width: min(1100px, 100%);
      margin: auto;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 1.1rem;
      margin-top: 0;
    }

    p {
      color: var(--muted);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .drop-zone {
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 42px 20px;
      text-align: center;
      cursor: pointer;
      background: rgba(90, 169, 255, 0.06);
      transition: 0.2s;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      background: rgba(90, 169, 255, 0.16);
    }

    .drop-zone strong {
      display: block;
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    input[type="file"] {
      display: none;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    input[type="number"],
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--text);
      padding: 9px;
      font: inherit;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      font-family: Consolas, monospace;
      font-size: 0.82rem;
    }

    input[type="range"] {
      width: 100%;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      background: var(--accent);
      color: #06111f;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button.secondary {
      background: #394352;
      color: var(--text);
    }

    button.danger {
      background: var(--danger);
      color: #240606;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .status {
      color: var(--muted);
      margin-top: 12px;
      min-height: 1.4em;
    }

    .result {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      margin-top: 20px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .preview {
      display: block;
      max-width: 260px;
      max-height: 180px;
      object-fit: contain;
      background:
        linear-gradient(45deg, #303640 25%, transparent 25%),
        linear-gradient(-45deg, #303640 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #303640 75%),
        linear-gradient(-45deg, transparent 75%, #303640 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px;
      margin-bottom: 12px;
    }

    .meta {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    .hint {
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer {
      width: min(1100px, 100%);
      margin: 30px auto 0;
      padding: 20px 0;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer p {
      margin: 0;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Image to Base64 Converter</h1>

    <p>
      Convert images to Base64 data URLs directly in your browser.
      Your files are not uploaded to a server.
    </p>

    <section class="panel">
      <div id="dropZone" class="drop-zone">
        <strong>Drop images here</strong>
        <span>or click to select files</span>
        <input id="fileInput" type="file" accept="image/*" multiple>
      </div>

      <div class="options">
        <label>
          Output format
          <select id="format">
            <option value="original">Keep original format</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WebP</option>
          </select>
        </label>

        <label>
          Maximum width in pixels
          <input
            id="maxWidth"
            type="number"
            min="1"
            placeholder="Original size"
          >
        </label>

        <label>
          Maximum height in pixels
          <input
            id="maxHeight"
            type="number"
            min="1"
            placeholder="Original size"
          >
        </label>

        <label>
          JPEG/WebP quality:
          <span id="qualityValue">90%</span>
          <input
            id="quality"
            type="range"
            min="1"
            max="100"
            value="90"
          >
        </label>
      </div>

      <div class="button-row">
        <button id="convertButton">Convert images</button>
        <button id="downloadAllButton" class="secondary">
          Download all as TXT
        </button>
        <button id="clearButton" class="danger">
          Clear all
        </button>
      </div>

      <div id="status" class="status"></div>
    </section>

    <section class="panel">
      <h2>Results</h2>
      <div id="results">
        <div class="empty">No images converted yet.</div>
      </div>
    </section>

    <section class="panel">
      <h2>Usage examples</h2>

      <p class="hint">HTML image:</p>
      <textarea readonly>&lt;img src="data:image/jpeg;base64,..." alt="Image"&gt;</textarea>

      <p class="hint">HTML favicon:</p>
      <textarea readonly>&lt;link rel="icon" type="image/png" href="data:image/png;base64,..."&gt;</textarea>

      <p class="hint">CSS background image:</p>
      <textarea readonly>background-image: url("data:image/png;base64,...");</textarea>
    </section>
  </main>

  <footer>
    <p>
      © <span id="currentYear"></span>
      <a
        href="https://github.com/TueftelTyp"
        target="_blank"
        rel="noopener noreferrer"
      >
        TüftelTyp
      </a>
    </p>
  </footer>

  <script>
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const convertButton = document.getElementById("convertButton");
    const downloadAllButton =
      document.getElementById("downloadAllButton");
    const clearButton = document.getElementById("clearButton");
    const results = document.getElementById("results");
    const status = document.getElementById("status");
    const formatSelect = document.getElementById("format");
    const maxWidthInput = document.getElementById("maxWidth");
    const maxHeightInput = document.getElementById("maxHeight");
    const qualityInput = document.getElementById("quality");
    const qualityValue = document.getElementById("qualityValue");
    const currentYear = document.getElementById("currentYear");

    let selectedFiles = [];
    let convertedResults = [];

    currentYear.textContent = new Date().getFullYear();

    qualityInput.addEventListener("input", () => {
      qualityValue.textContent = qualityInput.value + "%";
    });

    dropZone.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", event => {
      addFiles(event.target.files);
      fileInput.value = "";
    });

    ["dragenter", "dragover"].forEach(eventName => {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach(eventName => {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.remove("dragover");
      });
    });

    dropZone.addEventListener("drop", event => {
      addFiles(event.dataTransfer.files);
    });

    function addFiles(files) {
      const imageFiles = [...files].filter(file =>
        file.type.startsWith("image/")
      );

      selectedFiles.push(...imageFiles);

      if (imageFiles.length) {
        status.textContent =
          `${imageFiles.length} image(s) added.`;
      } else {
        status.textContent =
          "No valid image files selected.";
      }
    }

    convertButton.addEventListener("click", async () => {
      if (!selectedFiles.length) {
        status.textContent =
          "Please select at least one image.";
        return;
      }

      convertedResults = [];
      results.innerHTML = "";
      status.textContent = "Converting images...";

      for (const file of selectedFiles) {
        try {
          const converted = await convertImage(file);

          convertedResults.push(converted);
          renderResult(converted);
        } catch (error) {
          console.error(error);
          status.textContent =
            `Could not convert: ${file.name}`;
        }
      }

      status.textContent =
        `${convertedResults.length} image(s) converted successfully.`;
    });

    async function convertImage(file) {
      const originalDataUrl = await readFileAsDataURL(file);

      const outputFormat =
        formatSelect.value === "original"
          ? file.type
          : formatSelect.value;

      const needsProcessing =
        outputFormat !== file.type ||
        maxWidthInput.value ||
        maxHeightInput.value;

      if (!needsProcessing) {
        return {
          name: file.name,
          mime: file.type,
          dataUrl: originalDataUrl,
          originalSize: file.size
        };
      }

      const image = await loadImage(originalDataUrl);

      let width = image.naturalWidth;
      let height = image.naturalHeight;

      const maxWidth =
        Number(maxWidthInput.value) || width;

      const maxHeight =
        Number(maxHeightInput.value) || height;

      const scale = Math.min(
        1,
        maxWidth / width,
        maxHeight / height
      );

      width = Math.max(1, Math.round(width * scale));
      height = Math.max(1, Math.round(height * scale));

      const canvas = document.createElement("canvas");

      canvas.width = width;
      canvas.height = height;

      const context = canvas.getContext("2d");

      if (outputFormat === "image/jpeg") {
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, width, height);
      }

      context.drawImage(image, 0, 0, width, height);

      const quality =
        Number(qualityInput.value) / 100;

      const dataUrl = canvas.toDataURL(
        outputFormat,
        quality
      );

      return {
        name: file.name,
        mime: outputFormat,
        dataUrl,
        originalSize: file.size,
        width,
        height
      };
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;

        reader.readAsDataURL(file);
      });
    }

    function loadImage(dataUrl) {
      return new Promise((resolve, reject) => {
        const image = new Image();

        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = dataUrl;
      });
    }

    function renderResult(item) {
      const wrapper = document.createElement("article");
      wrapper.className = "result";

      const image = document.createElement("img");
      image.className = "preview";
      image.src = item.dataUrl;
      image.alt = item.name;

      const header = document.createElement("div");
      header.className = "result-header";

      const title = document.createElement("strong");
      title.textContent = item.name;

      const copyButton = document.createElement("button");
      copyButton.className = "secondary";
      copyButton.textContent = "Copy data URL";

      copyButton.addEventListener("click", async () => {
        await navigator.clipboard.writeText(item.dataUrl);

        copyButton.textContent = "Copied!";

        setTimeout(() => {
          copyButton.textContent = "Copy data URL";
        }, 1500);
      });

      header.append(title, copyButton);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent =
        `${item.mime}` +
        (item.width
          ? ` • ${item.width} × ${item.height}px`
          : "") +
        ` • ${formatBytes(item.dataUrl.length)}`;

      const fullLabel = document.createElement("p");
      fullLabel.className = "hint";
      fullLabel.textContent = "Complete data URL:";

      const fullOutput = document.createElement("textarea");
      fullOutput.value = item.dataUrl;
      fullOutput.readOnly = true;

      const base64Label = document.createElement("p");
      base64Label.className = "hint";
      base64Label.textContent =
        "Base64 only, without the prefix:";

      const prefix =
        `data:${item.mime};base64,`;

      const base64Only = document.createElement("textarea");
      base64Only.value = item.dataUrl.startsWith(prefix)
        ? item.dataUrl.substring(prefix.length)
        : item.dataUrl;
      base64Only.readOnly = true;

      const downloadButton = document.createElement("button");
      downloadButton.className = "secondary";
      downloadButton.textContent = "Download as TXT";

      downloadButton.addEventListener("click", () => {
        downloadText(
          `${item.name}.txt`,
          item.dataUrl
        );
      });

      wrapper.append(
        header,
        image,
        meta,
        fullLabel,
        fullOutput,
        base64Label,
        base64Only,
        document.createElement("br"),
        downloadButton
      );

      results.appendChild(wrapper);
    }

    downloadAllButton.addEventListener("click", () => {
      if (!convertedResults.length) {
        status.textContent =
          "There are no converted images to download.";
        return;
      }

      const content = convertedResults
        .map(item => {
          return `--- ${item.name} ---\n${item.dataUrl}`;
        })
        .join("\n\n");

      downloadText(
        "converted-images.txt",
        content
      );
    });

    clearButton.addEventListener("click", () => {
      selectedFiles = [];
      convertedResults = [];

      results.innerHTML =
        '<div class="empty">No images converted yet.</div>';

      status.textContent = "";
    });

    function downloadText(filename, content) {
      const blob = new Blob([content], {
        type: "text/plain;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = filename;
      link.click();

      URL.revokeObjectURL(url);
    }

    function formatBytes(bytes) {
      if (bytes < 1024) {
        return bytes + " B";
      }

      if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " KB";
      }

      return (bytes / 1024 / 1024).toFixed(1) + " MB";
    }
  </script>
</body>
</html>
