<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronotakt · Cron-Generator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19' fill='%23ffc24b'>✳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Chivo+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b151a; --panel:#101f27; --panel2:#0c161d; --ink:#0a1216;
  --line:rgba(190,225,235,.10); --line2:rgba(190,225,235,.18);
  --tx:#e9f3f4; --mut:#8fa8b0; --dim:#5f7780;
  --c-sec:#5eead4; --c-min:#ffc24b; --c-hour:#ff8a5c; --c-dom:#6ee7a0; --c-mon:#6cc4ff; --c-dow:#d9a7ff;
  --warn:#ffc24b; --err:#ff8080; --fc:#ffc24b;
  --fd:'Sora',sans-serif; --fb:'IBM Plex Sans',sans-serif; --fm:'Chivo Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.55 var(--fb);overflow-x:hidden}
::selection{background:#ffc24b33}

.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.glow{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.5}
.g1{background:radial-gradient(circle,#123039 0%,transparent 60%);top:-20vmax;left:-15vmax;animation:drift1 26s ease-in-out infinite alternate}
.g2{background:radial-gradient(circle,#2a1f10 0%,transparent 60%);bottom:-25vmax;right:-15vmax;animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(9vmax,7vmax)}}
@keyframes drift2{to{transform:translate(-8vmax,-6vmax)}}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(150,200,210,.10) 1px,transparent 1.4px);background-size:26px 26px;mask-image:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 80%)}
.ast{position:absolute;top:-140px;right:-140px;width:520px;height:520px;opacity:.05;animation:spin 240s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

.top{position:sticky;top:0;z-index:50;background:rgba(11,21,26,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:11px}
.brand svg{width:30px;height:30px;color:var(--c-min);animation:spin 40s linear infinite}
.brand b{font:800 1.15rem var(--fd);letter-spacing:.3px}
.brand small{display:block;font-size:.68rem;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-top:-2px}
.topright{display:flex;align-items:center;gap:14px}
.clock{font:500 .85rem var(--fm);color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-variant-numeric:tabular-nums}
.langsw{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.langsw button{background:transparent;border:0;color:var(--mut);font:600 .78rem var(--fd);padding:7px 11px;cursor:pointer;transition:.18s}
.langsw button:hover{color:var(--tx);background:rgba(255,255,255,.05)}
.langsw button.on{background:var(--c-min);color:#1a1206}

.btn-embed{background:transparent;border:1px solid var(--line2);color:var(--mut);font:600 .78rem var(--fd);padding:7px 12px;border-radius:10px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.btn-embed:hover{color:var(--c-min);border-color:var(--c-min);transform:translateY(-1px)}
.btn-embed svg{width:14px;height:14px}
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;max-width:640px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:slideUp .3s ease;position:relative}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal h3{font:700 1.25rem var(--fd);margin-bottom:8px;color:var(--c-min)}
.modal p{color:var(--mut);font-size:.9rem;margin-bottom:18px;line-height:1.5}
.modal-code{background:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:14px;margin-bottom:16px;position:relative}
.modal-code textarea{width:100%;background:transparent;border:0;color:var(--c-min);font:500 .8rem var(--fm);resize:vertical;min-height:110px;outline:none;line-height:1.6}
.modal-code .copy-float{position:absolute;top:8px;right:8px}
.modal-close{position:absolute;top:14px;right:14px;background:transparent;border:0;color:var(--dim);font-size:1.5rem;cursor:pointer;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;transition:.18s;line-height:1}
.modal-close:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.modal-actions{display:flex;justify-content:flex-end}

.hero{padding:52px 0 8px}
.kicker{font:600 .74rem var(--fm);letter-spacing:.22em;color:var(--c-min);text-transform:uppercase;margin-bottom:14px}
h1{font:800 clamp(2rem,4.6vw,3.3rem)/1.08 var(--fd);letter-spacing:-.02em;max-width:20ch}
.lead{color:var(--mut);max-width:62ch;margin-top:14px;font-size:1.02rem}

.exprcard{margin-top:30px;background:var(--ink);border:1px solid var(--line2);border-radius:16px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.exprslots{display:flex;gap:12px;flex-wrap:wrap}
.slot{flex:1 1 110px;min-width:96px;background:#0d181e;border:1px solid var(--line);border-bottom:3px solid var(--fc);border-radius:10px;padding:12px 12px 10px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.slot:hover{transform:translateY(-3px);border-color:var(--fc);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.slot .sv{display:block;font:700 clamp(1.15rem,2.3vw,1.7rem) var(--fm);color:var(--fc);word-break:break-all;transition:color .2s}
.slot.long .sv{font-size:1rem}
.slot.bad .sv{color:var(--err)}
.slot .sl{display:block;font:600 .64rem var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.slot.pop .sv{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.12)}}
.exprbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.cnt{font:500 .82rem var(--fm);color:var(--warn);border:1px dashed rgba(255,194,75,.4);border-radius:8px;padding:6px 11px;font-variant-numeric:tabular-nums;transition:.3s}
.cnt.hot{background:rgba(255,194,75,.12);animation:blink 1s ease infinite}
@keyframes blink{50%{opacity:.55}}
.flex1{flex:1}

.btn{font:600 .85rem var(--fd);border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid transparent;transition:.18s;display:inline-flex;align-items:center;gap:7px}
.btn.primary{background:var(--c-min);color:#1a1206}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,194,75,.25);filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--tx)}
.btn.ghost:hover{border-color:var(--c-min);color:var(--c-min);transform:translateY(-1px)}
.btn.sm{padding:5px 11px;font-size:.75rem;border-radius:8px}
.btn.ok{background:var(--c-dom)!important;color:#08240f!important;border-color:transparent!important}

/* ===== presets + scroller ===== */
.presets{margin:38px 0 8px}
h2{font:700 1.25rem var(--fd);letter-spacing:-.01em;margin-bottom:14px}
.presetwrap{position:relative}
.presetwrap::before,.presetwrap::after{content:'';position:absolute;top:0;bottom:0;width:56px;pointer-events:none;z-index:3;transition:opacity .3s}
.presetwrap::before{left:0;background:linear-gradient(90deg,var(--bg) 15%,transparent)}
.presetwrap::after{right:0;background:linear-gradient(-90deg,var(--bg) 15%,transparent)}
.presetwrap.at-left::before{opacity:0}
.presetwrap.at-right::after{opacity:0}
.presetrow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;-ms-overflow-style:none}
.presetrow::-webkit-scrollbar{display:none}
.pnav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,18,22,.88);backdrop-filter:blur(6px);color:var(--c-min);cursor:pointer;display:grid;place-items:center;transition:opacity .25s,border-color .18s,color .18s,transform .18s;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.pnav svg{width:16px;height:16px}
.pnav:hover{border-color:var(--c-min);color:#fff;transform:translateY(-50%) scale(1.1)}
.pnav.left{left:2px}
.pnav.right{right:2px}
.pnav.hide{opacity:0;pointer-events:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font:500 .83rem var(--fb);color:var(--tx);cursor:pointer;transition:.18s;white-space:nowrap}
.chip svg{width:15px;height:15px;color:var(--c-min)}
.chip:hover{transform:translateY(-2px);border-color:var(--c-min);box-shadow:0 6px 16px rgba(0,0,0,.3)}
.chip.hit{animation:chipflash .5s ease}
@keyframes chipflash{30%{background:rgba(255,194,75,.25)}}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 396px;gap:24px;margin-top:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}

.secswitch{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.sw{position:relative;width:46px;height:26px;flex:0 0 auto;margin-top:2px}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
.sw .tr{position:absolute;inset:0;background:#0a1419;border:1px solid var(--line2);border-radius:999px;transition:.2s}
.sw .kn{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:.2s}
.sw input:checked ~ .tr{background:rgba(94,234,212,.15);border-color:var(--c-sec)}
.sw input:checked ~ .kn{left:24px;background:var(--c-sec)}
.secswitch b{font:600 .95rem var(--fd)}
.secswitch p{font-size:.8rem;color:var(--mut);margin-top:2px}

.fpanel{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--fc);border-radius:14px;padding:18px 20px;margin-bottom:14px;transition:box-shadow .3s}
.fpanel.flash{animation:flashB 1.1s ease}
@keyframes flashB{0%,60%{box-shadow:0 0 0 3px var(--fc)}}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.fdot{width:10px;height:10px;border-radius:50%;background:var(--fc);box-shadow:0 0 10px var(--fc)}
.fhead h3{font:700 1.02rem var(--fd)}
.frange{font:500 .68rem var(--fm);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.fbadge{margin-left:auto;font:600 .9rem var(--fm);color:var(--fc);background:rgba(255,255,255,.04);border-radius:7px;padding:3px 10px;min-width:38px;text-align:center}
.fmodes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fmodes button{background:#0a1419;border:1px solid var(--line);color:var(--mut);font:600 .74rem var(--fb);border-radius:8px;padding:6px 11px;cursor:pointer;transition:.15s}
.fmodes button:hover{color:var(--tx);border-color:var(--line2)}
.fmodes button.on{background:var(--fc);border-color:var(--fc);color:#0a1419}
.fbody{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
input[type=number],input[type=text],select{background:var(--ink);border:1px solid var(--line2);border-radius:9px;color:var(--tx);font:500 .95rem var(--fm);padding:9px 11px;transition:.18s;outline:none}
input:focus,select:focus{border-color:var(--fc);box-shadow:0 0 0 3px color-mix(in srgb,var(--fc) 22%,transparent)}
input[type=number]{width:6rem;text-align:center}
select{min-width:10rem;cursor:pointer}
.txt{flex:1;min-width:200px}
.txt.bad{border-color:var(--err)}
.fnote{font-size:.8rem;color:var(--dim)}
.fnote code{color:var(--fc)}
.ferr{width:100%;font-size:.78rem;color:var(--err)}
.fprev{width:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fprev em{font-style:normal;font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.fprev b{font:500 .78rem var(--fm);color:var(--fc);background:rgba(255,255,255,.05);border-radius:6px;padding:2px 8px}

.out{position:sticky;top:84px}
.out h2{margin-bottom:8px}
.out h3{font:600 .72rem var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:20px 0 10px}
.outdesc{font:600 1.12rem/1.4 var(--fd);color:#fff;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:3.4em}
.warnchip{margin-top:10px;font-size:.78rem;color:var(--warn);background:rgba(255,194,75,.08);border:1px solid rgba(255,194,75,.3);border-radius:8px;padding:8px 11px}
.warnchip.err{color:var(--err);background:rgba(255,128,128,.08);border-color:rgba(255,128,128,.35)}
.nextlist{list-style:none}
.nextlist li{display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:9px;transition:.15s;animation:fadein .4s both}
.nextlist li:hover{background:rgba(255,255,255,.04)}
.nextlist i{font:700 .72rem var(--fm);font-style:normal;color:var(--c-hour);width:20px;height:20px;border:1px solid rgba(255,138,92,.4);border-radius:6px;display:grid;place-items:center;flex:0 0 auto}
.nextlist b{font:500 .86rem var(--fm);display:block;font-variant-numeric:tabular-nums}
.nextlist span{font-size:.72rem;color:var(--dim)}
.nonext{font-size:.82rem;color:var(--dim);padding:6px 0}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.cmdinput{width:100%;font-size:.88rem}
.cronline{margin-top:10px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:10px}
.cronline code{flex:1;font:500 .82rem var(--fm);color:var(--c-min);word-break:break-all}

.ref{margin:52px 0 30px}
.refgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:.85rem}
th{font:600 .68rem var(--fb);letter-spacing:.13em;text-transform:uppercase;color:var(--dim);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line2);background:var(--panel2)}
td{padding:10px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(255,255,255,.025)}
td:nth-child(2){font-family:var(--fm);font-size:.78rem;color:var(--c-dom)}
td:nth-child(3){font-family:var(--fm);color:var(--c-mon)}
.gloss{font-size:.75rem;color:var(--dim);margin-top:10px}
.tips{list-style:none;display:grid;gap:10px}
.tips li{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:.83rem;color:var(--mut);transition:.18s}
.tips li:hover{border-color:var(--line2);transform:translateX(4px);color:var(--tx)}
.tips code{font:500 .78rem var(--fm);color:var(--c-min);background:rgba(255,194,75,.08);border-radius:5px;padding:1px 6px}
.tips b{color:var(--tx)}

footer{border-top:1px solid var(--line);padding:22px 0 30px;margin-top:20px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--dim);align-items:center}
footer b{color:var(--mut);font-family:var(--fd)}
footer .foot-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
footer a.ttl{color:var(--c-min);text-decoration:none;font-weight:600;font-family:var(--fd);border-bottom:1px dashed rgba(255,194,75,.4);padding-bottom:1px;transition:.18s}
footer a.ttl:hover{color:#fff;border-bottom-color:var(--c-min);filter:brightness(1.15)}
footer a.ttl svg{width:11px;height:11px;margin-left:3px;vertical-align:middle;opacity:.7}
footer .syntax{font:500 .72rem var(--fm);color:var(--dim);letter-spacing:.1em}

.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}

/* ===== EMBED MODE ===== */
body.embed-mode .top,
body.embed-mode .ref,
body.embed-mode .kicker,
body.embed-mode .lead,
body.embed-mode footer .syntax,
body.embed-mode .bg,
body.embed-mode .btn-embed,
body.embed-mode .modal-overlay{display:none!important}
body.embed-mode .hero{padding:24px 0 4px}
body.embed-mode h1{font-size:clamp(1.4rem,3vw,2rem);max-width:100%}
body.embed-mode .exprcard{margin-top:18px;padding:18px}
body.embed-mode .presets{margin:22px 0 4px}
body.embed-mode .cols{margin-top:6px}
body.embed-mode .out{top:20px}
body.embed-mode footer{padding:14px 0 18px;margin-top:10px}

@media (max-width:1020px){
  .cols{grid-template-columns:1fr}
  .out{position:static}
  .refgrid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .topin{flex-wrap:wrap}
  .clock{display:none}
  .exprbar .btn{flex:1;justify-content:center}
  .modal{padding:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="glow g1"></div><div class="glow g2"></div><div class="dots"></div>
  <svg class="ast" viewBox="0 0 24 24" fill="none" stroke="#9fd8e0" stroke-width=".8" stroke-linecap="round">
    <path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9L4.9 19.1"/>
  </svg>
</div>

<header class="top">
  <div class="wrap topin">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
      <div><b>Cronotakt</b><small data-i="tagline"></small></div>
    </div>
    <div class="topright">
      <span class="clock" id="clock">--:--:--</span>
      <div class="langsw" id="langsw" role="group" aria-label="Language"></div>
      <button class="btn-embed" id="btnEmbed" title="Embed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        <span data-i="embedBtn">Embed</span>
      </button>
    </div>
  </div>
</header>

<!-- Embed Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <h3 data-i="embedTitle"></h3>
    <p data-i="embedDesc"></p>
    <div class="modal-code">
      <textarea id="embedCode" readonly spellcheck="false"></textarea>
      <button class="btn ghost sm copy-float" id="btnCopyEmbed" data-i="copy"></button>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCloseBtn" data-i="close"></button>
    </div>
  </div>
</div>

<main class="wrap">

  <section class="hero">
    <div class="reveal">
      <p class="kicker" data-i="kicker"></p>
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="intro"></p>
    </div>
    <div class="exprcard reveal">
      <div class="exprslots" id="slots"></div>
      <div class="exprbar">
        <span class="cnt" id="countdown"></span>
        <span class="flex1"></span>
        <button class="btn ghost" id="btnReset"></button>
        <button class="btn primary" id="btnCopyExpr"></button>
      </div>
    </div>
  </section>

  <section class="presets reveal">
    <h2 data-i="presets"></h2>
    <div class="presetwrap" id="presetwrap">
      <button class="pnav left hide" id="pnavL" aria-label="Scroll left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="presetrow" id="presetrow"></div>
      <button class="pnav right hide" id="pnavR" aria-label="Scroll right">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </section>

  <div class="cols">
    <div class="leftcol">
      <div class="card secswitch reveal">
        <label class="sw"><input type="checkbox" id="secSwitch"><span class="tr"></span><span class="kn"></span></label>

const $=s=>document.querySelector(s);

const pad=n=>String(n).padStart(2,'0');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

function detectLang(){
  if(embedMode){
    const p=new URLSearchParams(location.search).get('lang');
    if(p&&I18N[p])return p;
  }
  const saved=localStorage.getItem('cronotakt.lang');
  if(saved&&I18N[saved])return saved;
  const nav=(navigator.language||'de').slice(0,2).toLowerCase();
  return I18N[nav]?nav:'de';
}

/* ================= parsing ================= */
function valOf(tok,key){
  tok=String(tok).trim().toUpperCase();
  if(key==='month'){const i=MON3.indexOf(tok);if(i>-1)return i+1;}
  if(key==='dow'){const i=DOW3.indexOf(tok);if(i>-1)return i;}
  const n=+tok;
  if(!Number.isInteger(n))throw 0;
  if(key==='dow'&&n===7)return 0;
  const f=FDEF[key];
  if(n<f.min||n>=(key==='dow'?8:f.max+1))throw 0;
  return n;
}
function parsePart(p,key){
  p=p.trim();if(!p)throw 0;
  if(p==='*')return{kind:'all'};
  let step=null;
  if(p.includes('/')){const[a,b]=p.split('/');step=+b;p=a;if(!Number.isInteger(step)||step<1)throw 0;if(p==='*')p=FDEF[key].min;}
  if(p.includes('-')){
    const[a,b]=p.split('-').map(x=>valOf(x,key));
    if(a>b)throw 0;
    return{kind:step!=null?'rangeStep':'range',a,b,step};
  }
  const v=valOf(p,key);
  return step!=null?{kind:'step',a:v,step}:{kind:'single',v};
}
function parseField(str,key){
  const out={star:false,parts:[],ok:true};
  str=(str||'').trim();
  if(!str){out.ok=false;return out;}
  if(str==='*'){out.star=true;return out;}
  try{out.parts=str.split(',').map(p=>parsePart(p,key));}
  catch(e){out.ok=false;}
  return out;
}
function parseAll(){const o={};for(const k of FORDER)o[k]=parseField(state.f[k],k);return o;}
function expand(parsed,key){
  const f=FDEF[key],set=new Set(),max=key==='dow'?6:f.max;
  if(parsed.star){for(let i=f.min;i<=max;i++)set.add(i);return set;}
  if(!parsed.ok)return set;
  for(const p of parsed.parts){
    if(p.kind==='all'){for(let i=f.min;i<=max;i++)set.add(i);}
    else if(p.kind==='single')set.add(Math.min(p.v,max));
    else if(p.kind==='range')for(let i=p.a;i<=Math.min(p.b,max);i++)set.add(i);
    else if(p.kind==='step')for(let i=p.a;i<=max;i+=p.step)set.add(i);
    else if(p.kind==='rangeStep')for(let i=p.a;i<=Math.min(p.b,max);i+=p.step)set.add(i);
  }
  return set;
}

/* ================= next runs ================= */
function computeNext(P,count,withSec){
  const sets={month:expand(P.month,'month'),dom:expand(P.dom,'dom'),dow:expand(P.dow,'dow'),hour:expand(P.hour,'hour'),min:expand(P.min,'min')};
  const domR=!P.dom.star,dowR=!P.dow.star;
  const hours=[...sets.hour].sort((a,b)=>a-b),mins=[...sets.min].sort((a,b)=>a-b);
  let secs=[0];
  if(withSec)secs=[...expand(P.sec,'sec')].sort((a,b)=>a-b);
  const res=[],now=new Date();
  const start=new Date(now.getTime());
  if(withSec)start.setSeconds(start.getSeconds()+1,0);
  else{start.setSeconds(0,0);start.setMinutes(start.getMinutes()+1);}
  const end=new Date(now);end.setFullYear(end.getFullYear()+4);
  const day=new Date(start);day.setHours(0,0,0,0);
  const dayOK=d=>{
    const dm=sets.dom.has(d.getDate()),wm=sets.dow.has(d.getDay());
    return sets.month.has(d.getMonth()+1)&&((domR||dowR)?(dm||wm):(dm&&wm));
  };
  let guard=0;
  while(day<=end&&res.length<count&&guard++<1700){
    if(dayOK(day)){
      outer:
      for(const h of hours){
        for(const mi of mins){
          const base=new Date(day);base.setHours(h,mi,0,0);
          if(base.getTime()+secs[secs.length-1]*1000<start.getTime())continue;
          for(const s of secs){
            const t=new Date(base);t.setSeconds(s);
            if(t>=start){res.push(t);if(res.length>=count)break outer;}
          }
        }
      }
    }
    day.setDate(day.getDate()+1);
  }
  return res;
}

/* ================= description ================= */
function joinAnd(arr,w){if(arr.length<2)return arr.join('');return arr.slice(0,-1).join(', ')+` ${w} `+arr[arr.length-1];}
function listTxt(key,P){
  const D=L().d,mon=L().months,dow=L().dows;
  const r=P[key].parts.map(p=>{
    if(p.kind==='single')return fmtVal(key,p.v);
    if(p.kind==='range')return fmtRange(key,p.a,p.b);
    if(p.kind==='step')return`${p.a}/${p.step}`;
    return`${p.a}-${p.b}/${p.step}`;
  });
  return joinAnd(r,D.and);
  function fmtVal(k,v){
    if(k==='month')return mon[v-1];
    if(k==='dow')return dow[v];
    if(k==='dom')return D.domVal(v);
    return k==='hour'?pad(v):String(v);
  }
  function fmtRange(k,a,b){
    if(k==='month')return`${mon[a-1]}–${mon[b-1]}`;
    if(k==='dow')return`${dow[a]}–${dow[b]}`;
    if(k==='dom')return D.domRangeVals(a,b);
    return`${a}-${b}`;
  }
}
function fromNote(key,p){
  if((p.kind==='step'||p.kind==='rangeStep')&&p.a>FDEF[key].min)return` (${L().d.fromWord[key]} ${p.a})`;
  return'';
}
function composeDescr(){
  const D=L().d,P=parseAll(),w=state.secOn;
  const R={};FORDER.forEach(k=>R[k]=!P[k].star);
  const single=k=>R[k]&&P[k].parts.length===1&&P[k].parts[0].kind==='single';
  const step1=k=>R[k]&&P[k].parts.length===1&&P[k].parts[0].kind==='step';
  const cal=!R.dom&&!R.month&&!R.dow;
  const jf=a=>cap(a.filter(Boolean).join(', '));

  const secFrag=()=>{const p=P.sec.parts;
    if(p.length===1&&p[0].kind==='step')return D.nSec(p[0].step)+fromNote('sec',p[0]);
    return D.secParts(listTxt('sec',P));};
  const domPhrase=()=>{const p=P.dom.parts;
    if(p.length===1&&p[0].kind==='range')return D.domRangePhrase(D.domVal(p[0].a),D.domVal(p[0].b));
    return D.domAt(listTxt('dom',P));};
  const monPhrase=()=>{const p=P.month.parts;
    if(p.length===1&&p[0].kind==='range')return D.monthRangePhrase(L().months[p[0].a-1],L().months[p[0].b-1]);
    return D.monthIn(listTxt('month',P));};
  const dowPhrase=()=>{const p=P.dow.parts;
    if(p.length===1&&p[0].kind==='range')return D.dowRangeAlone(L().dows[p[0].a],L().dows[p[0].b]);
    return D.dowOn(listTxt('dow',P));};
  const calFrags=()=>[R.dom?domPhrase():null,R.month?monPhrase():null,R.dow?dowPhrase():null];
  const dowTimeFrag=t=>{const p=P.dow.parts,d=L().dows;
    if(p.length===1&&p[0].kind==='single')return D.everyDowAt(d[p[0].v],t);
    if(p.length===1&&p[0].kind==='range')return D.dowRangeAt(d[p[0].a],d[p[0].b],t);
    return D.weekListAt(joinAnd(p.map(x=>x.kind==='single'?d[x.v]:'…'),D.and),t);};

  if(w&&!R.min&&!R.hour&&cal){
    if(!R.sec)return D.everySec;
    return cap(secFrag());
  }
  if(!R.min&&!R.hour&&cal)return D.everyMin;

  const frags=[];
  if(w&&R.sec)frags.push(secFrag());

  const time=(single('min')&&single('hour'))?pad(P.hour.parts[0].v)+':'+pad(P.min.parts[0].v):null;
  if(time){
    if(cal)return jf([...frags,D.dailyAt(time)]);
    if(R.dow&&!R.dom&&!R.month)return jf([...frags,dowTimeFrag(time)]);
    if(single('dom')&&single('month')&&!R.dow)
      return jf([...frags,D.yearlyAt(D.domVal(P.dom.parts[0].v),L().months[P.month.parts[0].v-1],time)]);
    if(R.dom&&!R.month&&!R.dow)return jf([...frags,D.monthlyAt(listTxt('dom',P),time)]);
  }
  if(single('min')&&!R.hour)return jf([...frags,D.atEveryHour(pad(P.min.parts[0].v)),...calFrags()]);
  if(!R.min&&R.hour&&cal&&(!w||!R.sec))return jf([D.everyMinIn(listTxt('hour',P))]);

  if(R.min){
    if(step1('min'))frags.push(D.nMin(P.min.parts[0].step)+fromNote('min',P.min.parts[0]));
    else frags.push(D.minParts(listTxt('min',P)));
  }else if(R.hour)frags.push(D.everyMin);
  if(R.hour){
    if(step1('hour'))frags.push(D.nHour(P.hour.parts[0].step)+fromNote('hour',P.hour.parts[0]));
    else frags.push(D.hourParts(listTxt('hour',P)));
  }
  frags.push(...calFrags());
  if(!frags.length)return w?D.everySec:D.everyMin;
  return jf(frags);
}

/* ================= UI building ================= */
function buildLangSw(){
  const box=$('#langsw');box.innerHTML='';
  if(embedMode){box.style.display='none';return;}
  for(const c of['de','en','fr','es']){
    const b=document.createElement('button');
    b.textContent=c.toUpperCase();
    b.className=c===lang?'on':'';
    b.onclick=()=>{if(c===lang)return;lang=c;localStorage.setItem('cronotakt.lang',c);applyLang();};
    box.append(b);
  }
}
function activeKeys(){return state.secOn?FORDER:FORDER.slice(1);}
function exprString(){return activeKeys().map(k=>state.f[k]).join(' ');}
function detectMode(str){
  str=str.trim();
  if(str==='*')return'all';
  if(str.includes(','))return'list';
  if(str.includes('/'))return'step';
  if(str.includes('-'))return'range';
  return'single';
}
function buildSlots(){
  const box=$('#slots');box.innerHTML='';
  for(const k of activeKeys()){
    const d=document.createElement('div');
    d.className='slot';d.style.setProperty('--fc',`var(${FCOL[k]})`);
    d.title=L().fields[k];
    d.innerHTML=`<span class="sv"></span><span class="sl">${L().fields[k]}</span>`;
    d.onclick=()=>{const p=document.getElementById('pnl-'+k);if(p){p.scrollIntoView({behavior:'smooth',block:'center'});p.classList.remove('flash');void p.offsetWidth;p.classList.add('flash');}};
    box.append(d);
  }
}
function buildPresets(){
  const row=$('#presetrow');row.innerHTML='';
  PRESETS.forEach((p,i)=>{
    const c=document.createElement('button');
    c.className='chip';
    c.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[p.icon]}</svg>${L().presetsList[i]}`;
    c.onclick=()=>{
      if(PRESETS[i].f.sec&&!state.secOn){state.secOn=true;$('#secSwitch').checked=true;}
      for(const k of FORDER)state.f[k]=PRESETS[i].f[k]||'*';
      buildSlots();buildPanels();refresh();
      c.classList.remove('hit');void c.offsetWidth;c.classList.add('hit');
    };
    row.append(c);
  });
  updateNav();
}
function buildRef(){

/* --- field panels --- */
function buildPanels(){
  const box=$('#panels');box.innerHTML='';
  for(const k of activeKeys())box.append(makePanel(k));
}
function makePanel(key){
  const f=FDEF[key],named=key==='month'||key==='dow';
  const sec=document.createElement('section');
  sec.className='fpanel';sec.id='pnl-'+key;
  sec.style.setProperty('--fc',`var(${FCOL[key]})`);
  sec.innerHTML=`
    <div class="fhead"><span class="fdot"></span><h3>${L().fields[key]}</h3>
      <span class="frange">${L().frange[key]}</span><code class="fbadge"></code></div>
    <div class="fmodes"></div><div class="fbody"></div>`;
  const modesEl=sec.querySelector('.fmodes');
  for(const m of MODES){
    const b=document.createElement('button');
    b.textContent=L().modes[m];b.dataset.mode=m;
    b.onclick=()=>{switchMode(key,m,sec);};
    modesEl.append(b);
  }
  renderPanelBody(key,sec);
  syncModeButtons(key,sec);
  updateBadge(key,sec);
  return sec;
}
function syncModeButtons(key,sec){
  const mode=detectMode(state.f[key]);
  sec.querySelectorAll('.fmodes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
}
function updateBadge(key,sec){
  sec.querySelector('.fbadge').textContent=state.f[key];
}
function switchMode(key,mode,sec){
  const f=FDEF[key],cur=state.f[key];
  if(detectMode(cur)===mode)return;
  let next='*';
  if(mode==='single')next=String(key==='dom'?'1':f.min);
  if(mode==='step')next='*/5';
  if(mode==='range')next=key==='hour'?'9-17':key==='dow'?'1-5':`${f.min}-${Math.min(f.min+10,key==='dow'?6:f.max)}`;
  if(mode==='list'){
    try{next=[...expand(parseField(cur,key),key)].sort((a,b)=>a-b).join(',');}catch(e){next='';}
  }
  state.f[key]=next;
  renderPanelBody(key,sec);syncModeButtons(key,sec);updateBadge(key,sec);refresh();
}
function fld(label,el){const w=document.createElement('label');w.className='fld';const s=document.createElement('span');s.textContent=label;w.append(s,el);return w;}
function numInput(val,min,max){
  const i=document.createElement('input');i.type='number';i.min=min;i.max=max;i.value=val;
  i.addEventListener('change',()=>{let v=Math.round(+i.value||min);v=Math.max(min,Math.min(max,v));i.value=v;});
  return i;
}
function namedSelect(key,val){
  const s=document.createElement('select');
  if(key==='month'){
    for(let m=1;m<=12;m++){const o=new Option(`${m} · ${L().months[m-1]}`,m);s.add(o);}
    s.value=val||1;
  }else{
    for(let v=0;v<=7;v++){
      const lbl=v===7?`7 · ${L().dows[0]} (=0)`:`${v} · ${L().dows[v]}`;
      s.add(new Option(lbl,v));
    }
    s.value=val||0;
  }
  return s;
}
function renderPanelBody(key,sec){
  const body=sec.querySelector('.fbody');body.innerHTML='';
  const f=FDEF[key],named=key==='month'||key==='dow';
  const mode=detectMode(state.f[key]);
  const P=parseField(state.f[key],key);
  const emit=()=>{updateBadge(key,sec);refresh();};

  if(mode==='all'){
    const n=document.createElement('div');n.className='fnote';n.innerHTML=L().allNote;body.append(n);
    return;
  }
  if(mode==='single'){
    const v=P.ok&&P.parts[0]&&P.parts[0].kind==='single'?P.parts[0].v:f.min;
    const el=named?namedSelect(key,v):numInput(v,f.min,f.max);
    el.addEventListener('input',()=>{state.f[key]=String(el.value);emit();});
    body.append(fld(L().fields[key],el));return;
  }
  if(mode==='step'){
    const p=P.ok&&P.parts[0]?P.parts[0]:{a:f.min,step:5};
    const start=named?namedSelect(key,p.a):numInput(p.a,f.min,f.max);
    const step=numInput(p.step||5,1,f.max);
    start.addEventListener('input',()=>{state.f[key]=(+start.value===f.min)?`*/${step.value}`:`${start.value}/${step.value}`;emit();});
    step.addEventListener('input',()=>{state.f[key]=(+start.value===f.min)?`*/${step.value}`:`${start.value}/${step.value}`;emit();});
    body.append(fld(L().from,start),fld(L().every,step));return;
  }
  if(mode==='range'){
    const p=P.ok&&P.parts[0]?P.parts[0]:{a:f.min,b:f.max};
    const a=named?namedSelect(key,p.a):numInput(p.a,f.min,f.max);
    const b=named?namedSelect(key,p.b):numInput(p.b,f.min,f.max);
    const up=()=>{let x=+a.value,y=+b.value;if(x>y)[x,y]=[y,x];state.f[key]=`${x}-${y}`;emit();};
    a.addEventListener('input',up);b.addEventListener('input',up);
    const dash=document.createElement('span');dash.className='fnote';dash.textContent='–';
    body.append(fld(L().from,a),dash,fld(L().to,b));return;
  }
  const inp=document.createElement('input');inp.type='text';inp.className='txt';
  inp.placeholder=L().listPh;inp.value=state.f[key]==='*'?'':state.f[key];
  const err=document.createElement('div');err.className='ferr';err.hidden=true;err.textContent=L().listErr;
  const prev=document.createElement('div');prev.className='fprev';
  inp.addEventListener('input',()=>{
    state.f[key]=inp.value.trim()||'*';
    const pp=parseField(state.f[key],key);
    inp.classList.toggle('bad',!pp.ok);err.hidden=pp.ok;
    prev.innerHTML='';
    if(pp.ok&&!pp.star){
      const em=document.createElement('em');em.textContent=L().listPreview+':';prev.append(em);
      [...expand(pp,key)].sort((a,b)=>a-b).slice(0,20).forEach(v=>{const b=document.createElement('b');b.textContent=v;prev.append(b);});
    }
    emit();
  });
  body.append(fld(L().modes.list,inp),err,prev);
  if(P.ok&&!P.star)inp.dispatchEvent(new Event('input'));
}

/* ================= refresh ================= */
function refresh(){
  const P=parseAll(),keys=activeKeys();
  const valid=keys.every(k=>P[k].ok);
  document.querySelectorAll('#slots .slot').forEach((el,i)=>{
    const k=keys[i],v=state.f[k],sv=el.querySelector('.sv');
    if(sv.textContent!==v){
      sv.textContent=v;
      el.classList.toggle('long',v.length>6);
      el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
    }
    el.classList.toggle('bad',!P[k].ok);
  });
  $('#desc').textContent=valid?composeDescr():L().invalid;
  $('#warnInvalid').hidden=valid;
  $('#warnDom').hidden=!(valid&&!P.dom.star&&!P.dow.star);
  nextTimes=valid?computeNext(P,7,state.secOn):[];
  renderNext();
  $('#cronline').textContent=`${exprString()} ${$('#cmd').value||L().cmdPh}`;
  lastExpr=exprString();
}
function renderNext(){
  const ol=$('#nextlist');ol.innerHTML='';
  const fmt=new Intl.DateTimeFormat(L().locale,{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:state.secOn?'2-digit':undefined,hour12:false});
  const rtf=new Intl.RelativeTimeFormat(L().locale,{numeric:'always'});
  nextTimes.forEach((t,i)=>{
    const li=document.createElement('li');li.style.animationDelay=(i*55)+'ms';
    const s=Math.round((t-Date.now())/1000);
    let rel;
    if(s<60)rel=rtf.format(s,'second');
    else if(s<5400)rel=rtf.format(Math.round(s/60),'minute');
    else if(s<172800)rel=rtf.format(Math.round(s/3600),'hour');
    else rel=rtf.format(Math.round(s/86400),'day');
    li.innerHTML=`<i>${i+1}</i><div><b>${fmt.format(t)}</b><span>${rel}</span></div>`;
    ol.append(li);
  });
  $('#nonext').hidden=!(nextTimes.length===0);
}

/* ================= language apply ================= */
function applyLang(){
  const T=L();
  document.documentElement.lang=lang;
  document.title=T.docTitle;
  document.querySelectorAll('[data-i]').forEach(el=>{
    const k=el.dataset.i;if(T[k]&&typeof T[k]==='string')el.textContent=T[k];
  });
  $('#warnDom').textContent=T.hintDomDow;
  $('#warnInvalid').textContent=T.invalid;
  $('#nonext').textContent=T.noRuns;
  const cmd=$('#cmd');
  cmd.placeholder=T.cmdPh;
  if(state.cmdDefault)cmd.value='';
  buildLangSw();buildSlots();buildPresets();buildPanels();buildRef();
  refresh();
}

async function copyText(txt,btn){
  try{await navigator.clipboard.writeText(txt);}
  catch(e){
    const ta=document.createElement('textarea');ta.value=txt;document.body.append(ta);
    ta.select();document.execCommand('copy');ta.remove();
  }
  const old=btn.textContent;
  btn.textContent=L().copied;btn.classList.add('ok');
  setTimeout(()=>{btn.textContent=old;btn.classList.remove('ok');},1400);
}

/* ================= ticker ================= */
setInterval(()=>{
  const now=new Date();
  $('#clock').textContent=new Intl.DateTimeFormat(L().locale,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
  const cd=$('#countdown');
  if(!nextTimes.length){cd.textContent='—';cd.classList.remove('hot');return;}
  const diff=(nextTimes[0]-now)/1000;
  if(diff<=0){refresh();return;}
  if(diff<90){
    const s=Math.ceil(diff);
    cd.textContent=`${L().nextIn}: ${s} s`;
    cd.classList.toggle('hot',s<=10);
  }else{
    const short=new Intl.DateTimeFormat(L().locale,{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false});
    cd.textContent=`${L().nextIn}: ${short.format(nextTimes[0])}`;
    cd.classList.remove('hot');
  }
},1000);

/* ================= preset scroller ================= */
const pRow=$('#presetrow'),pWrap=$('#presetwrap'),pL=$('#pnavL'),pR=$('#pnavR');
let pHover=false,pDir=0,pPow=0,pRaf=null;

function updateNav(){
  const canL=pRow.scrollLeft>2;
  const canR=pRow.scrollLeft+pRow.clientWidth<pRow.scrollWidth-2;
  pL.classList.toggle('hide',!canL);
  pR.classList.toggle('hide',!canR);
  pWrap.classList.toggle('at-left',!canL);
  pWrap.classList.toggle('at-right',!canR);
}
function pLoop(){
  if(!pHover){pRaf=null;return;}
  if(pDir!==0){pRow.scrollLeft+=pDir*(2+pPow*13);updateNav();}
  pRaf=requestAnimationFrame(pLoop);
}
pRow.addEventListener('mousemove',e=>{
  const r=pRow.getBoundingClientRect();
  const x=e.clientX-r.left,zone=Math.min(90,r.width*0.25);
  if(x<zone){pDir=-1;pPow=1-x/zone;}
  else if(x>r.width-zone){pDir=1;pPow=1-(r.width-x)/zone;}
  else{pDir=0;pPow=0;}
});
pRow.addEventListener('mouseenter',()=>{pHover=true;if(!pRaf)pRaf=requestAnimationFrame(pLoop);});
pRow.addEventListener('mouseleave',()=>{pHover=false;pDir=0;pPow=0;});
pL.addEventListener('click',()=>pRow.scrollBy({left:-pRow.clientWidth*0.7,behavior:'smooth'}));
pR.addEventListener('click',()=>pRow.scrollBy({left:pRow.clientWidth*0.7,behavior:'smooth'}));
pRow.addEventListener('scroll',updateNav,{passive:true});
window.addEventListener('resize',updateNav);

/* ================= init ================= */
lang=detectLang();
if(embedMode)document.body.classList.add('embed-mode');
document.getElementById('year').textContent=new Date().getFullYear();

$('#secSwitch').addEventListener('change',e=>{
  state.secOn=e.target.checked;
  buildSlots();buildPanels();refresh();
});
$('#btnCopyExpr').addEventListener('click',e=>copyText(exprString(),e.currentTarget));
$('#btnCopyLine').addEventListener('click',e=>copyText($('#cronline').textContent,e.currentTarget));
$('#btnReset').addEventListener('click',()=>{
  state.secOn=false;$('#secSwitch').checked=false;
  for(const k of FORDER)state.f[k]='*';
  buildSlots();buildPanels();refresh();
});
$('#cmd').addEventListener('input',e=>{state.cmdDefault=!e.target.value;refresh();});

/* ===== EMBED MODAL ===== */
const modalOverlay=$('#modalOverlay');
const embedCode=$('#embedCode');
const embedIframeCode=`<iframe src="${location.href.split('?')[0].split('#')[0]}?embed=1" style="width:100%;height:720px;border:0;border-radius:12px" loading="lazy"></iframe>`;

function openModal(){
  embedCode.value=embedIframeCode;
  modalOverlay.classList.add('active');
  setTimeout(()=>embedCode.select(),50);
}
function closeModal(){modalOverlay.classList.remove('active');}

$('#btnEmbed').addEventListener('click',openModal);
$('#modalClose').addEventListener('click',closeModal);
$('#modalCloseBtn').addEventListener('click',closeModal);
modalOverlay.addEventListener('click',e=>{if(e.target===modalOverlay)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('#btnCopyEmbed').addEventListener('click',e=>copyText(embedCode.value,e.currentTarget));

applyLang();

if(!embedMode){
  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}}),{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
}else{
  document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
}
</script>
